<!doctype html>
<!--
  Hebrew by Book — progress board (Steve's one-stop status surface).
  Status updates edit ONLY the data block between the DATA START / DATA END markers.
  Validate after every edit:  node test/board.check.mjs
  Tabs: Roadmap · Your queue (only-Steve actions) · Try this · Docs.
  Try-this ticks and notes live in this browser's localStorage, never in this file.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hebrew by Book board</title>
<style>
:root { --paper:#F4F1EA; --card:#fff; --ink:#2A2118; --ink2:#5E5348; --ink3:#8C8176; --line:#E0D9CE; --pen:#8A3F12; --pen-soft:#F6E7DC; --good:#1D7A4E; --good-soft:#DFF2E7; --warn:#9A6700; --warn-soft:#FFF2CC; --bad:#C2372B; --bad-soft:#FBE3DF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper:#17130F; --card:#221C16; --ink:#F2ECE4; --ink2:#C7BCAE; --ink3:#8F8578; --line:#3A3128; --pen:#F0A574; --pen-soft:#3B2618; --good:#5FD39A; --good-soft:#163726; --warn:#F4C861; --warn-soft:#3E3011; --bad:#FF8A7A; --bad-soft:#442020; } }
:root[data-theme="dark"] { --paper:#17130F; --card:#221C16; --ink:#F2ECE4; --ink2:#C7BCAE; --ink3:#8F8578; --line:#3A3128; --pen:#F0A574; --pen-soft:#3B2618; --good:#5FD39A; --good-soft:#163726; --warn:#F4C861; --warn-soft:#3E3011; --bad:#FF8A7A; --bad-soft:#442020; }
* { box-sizing: border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding:16px 16px 0; max-width:760px; margin:0 auto; }
h1 { font-size:22px; margin:0; } .asof { color:var(--ink3); font-size:13px; margin-top:4px; }
nav { display:flex; gap:4px; margin-top:12px; border-bottom:1px solid var(--line); overflow-x:auto; }
nav button { background:none; border:0; border-bottom:3px solid transparent; padding:8px 10px; font:inherit; color:var(--ink2); cursor:pointer; white-space:nowrap; }
nav button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--pen); font-weight:700; }
nav .n { display:inline-block; min-width:1.4em; padding:0 5px; margin-left:4px; border-radius:999px; background:var(--pen-soft); color:var(--pen); font-size:12px; }
main { max-width:760px; margin:0 auto; padding:16px; }
.card { background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.06); margin-bottom:12px; }
.card h2 { font-size:17px; margin:0 0 6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.chip { font-size:12px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--line); color:var(--ink2); }
.chip.done { background:var(--good-soft); color:var(--good); } .chip.active { background:var(--pen-soft); color:var(--pen); } .chip.next { background:var(--warn-soft); color:var(--warn); }
.chip.now { background:var(--bad-soft); color:var(--bad); } .chip.soon { background:var(--warn-soft); color:var(--warn); } .chip.later { background:var(--line); color:var(--ink2); }
ul.tasks { list-style:none; padding:0; margin:8px 0 0; display:grid; gap:4px; }
ul.tasks li { display:grid; grid-template-columns:1.4em 1fr; gap:6px; font-size:15px; }
.st-done::before { content:"✓"; color:var(--good); } .st-doing::before { content:"◐"; color:var(--pen); } .st-todo::before { content:"○"; color:var(--ink3); }
.p { color:var(--ink2); font-size:15px; margin:4px 0 0; }
.muted { color:var(--ink3); font-size:13px; }
.struck h2, .struck .p { text-decoration:line-through; opacity:.6; }
.try textarea { width:100%; min-height:3em; font:inherit; border:1px solid var(--line); border-radius:8px; padding:6px 8px; background:var(--paper); color:var(--ink); margin-top:8px; }
.try label { display:flex; gap:8px; align-items:center; margin-top:8px; font-size:14px; }
.btn { font:inherit; font-weight:700; border:0; border-radius:10px; padding:10px 14px; background:var(--pen); color:#fff; cursor:pointer; }
a { color:var(--pen); }
.stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:8px; margin-bottom:12px; }
.stat { background:var(--card); border-radius:10px; padding:8px 12px; } .stat b { display:block; font-size:22px; } .stat span { font-size:12px; color:var(--ink2); }
</style>
</head>
<body>
<header><h1>Hebrew by Book · board</h1><div class="asof" id="asof"></div>
<nav role="tablist" id="tabs"></nav></header>
<main id="main"></main>
<script>
/* ==== DATA START ==== */
const BOARD = {
  meta: {
    asOf: '2026-10-24',
    headline: 'New: three buttons after a finished day: Review 10, Write 10 (writing only) and Meet 5 new. Words also show up in different verses each time a card comes back.',
    stats: [
      { label: 'Ruth words taught', value: '287' },
      { label: 'names (own tab)', value: '30' },
      { label: 'written/read places', value: '13' },
      { label: 'tests passing', value: '128' },
      { label: 'links live', value: '90/90' },
    ],
    links: [
      { label: 'Live site', href: 'https://steveandlori.github.io/hebrew-by-book/' },
      { label: 'GitHub repo', href: 'https://github.com/steveandlori/hebrew-by-book' },
      { label: 'STATUS.md (narrative)', href: 'STATUS.md' },
    ],
  },
  roadmap: [
    { id: 'm1', title: 'First slice: Ruth, end to end', status: 'done',
      summary: 'Data pipeline from pinned sources (OSHB text and parsing, TBESH glosses, BDB citations) with ketiv and qere both kept; the guided Today loop adapted from josie-stats; Read, Written and read, Words, Names, Progress, Settings. Reviewed, fixed, confirmed, QA’d and published 2026-10-22.',
      tasks: [
        { t: 'Pipeline: pinned, checksummed sources; both readings first-class; fails loudly on gaps', s: 'done' },
        { t: 'Morphology decoded from OSHB’s published code tables (fixes lomed’s participle and stem bugs)', s: 'done' },
        { t: 'Deck: word, word-in-verse, other forms, Which word? (look-alike dictionary words)', s: 'done' },
        { t: 'App views and Hebrew typography (vendored Noto Serif Hebrew, pointed/unpointed)', s: 'done' },
        { t: 'Unit tests (Python 39, JS 58) and link check (90/90)', s: 'done' },
        { t: 'Content review A (cited sources) and B (independent: BDB via Sefaria, GKC): 8 must-fix found, all fixed', s: 'done' },
        { t: 'Fresh code review: 6 should-fix, all fixed', s: 'done' },
        { t: 'Fix confirmed findings (about 60 gloss corrections, each citing a BDB page)', s: 'done' },
        { t: 'Reviewers confirm the fixes', s: 'done' },
        { t: 'QA agent with written test plan, 7-day simulation: SHIP', s: 'done' },
        { t: 'Publish: public GitHub repo + Pages', s: 'done' },
      ] },
    { id: 'm2', title: 'Deepen Ruth', status: 'active',
      summary: 'Steve’s feedback comes first. 2026-10-22: plain English for each word in its verse, and notes on look-alike words. 2026-10-23: הוּא/הִיא as two words, the pad fix, Meet stars, Write the Hebrew, a Haktuvim audio link, README and licence. Still banked: verb parsing drills; ketiv/qere as drilled cards; offline use and cache-busting; research additions to How it works.',
      tasks: [
        { t: 'Plain English for every word in its verse (“and she went / walked”), short breakdown after, full parse folded away', s: 'done' },
        { t: 'Verb senses by stem from BDB (e.g. 1:20 Hiphil “made bitter”, 4:18 “fathered”); participles used as nouns (“redeemer”)', s: 'done' },
        { t: '“Don’t confuse” notes: same-letter words in Ruth listed automatically, plus reviewed notes (אֶל vs אֵל “God”)', s: 'done' },
        { t: 'Independent review of all 1,306 renderings against parse and BDB: 8 must-fix, 23 should-fix, all fixed and confirmed', s: 'done' },
        { t: 'Publish', s: 'done' },
        { t: 'הוּא “he” and הִיא “she” learned as two words (Strong’s files both under one number)', s: 'done' },
        { t: 'Writing pad: ink no longer shrinks each time you leave and return to full screen', s: 'done' },
        { t: 'Gold stars, outlined, for each fifth of Meet, banked to five; a spark for 3 right in a row on Which word? (graded by the app)', s: 'done' },
        { t: 'Stars evenly spaced: counted in clean recalls, not finished cards (version 1 bunched them at the end; Steve noticed)', s: 'done' },
        { t: 'Write the Hebrew cards: the word blanked in its verse, write its dictionary form (or, in Settings, the form in the verse); answer shows both. Steve tried it: “worked well”', s: 'done' },
        { t: 'Write the Hebrew unlocks after reading the word in its verse, joining the same session; Settings: after 1, 2 (default), 3 or 5 views, or Off', s: 'done' },
        { t: 'Read: “Listen to chapter N on Haktuvim” (native reader’s recording)', s: 'done' },
        { t: 'README rewritten (what it does, layout, development, data overrides); MIT License © Steve Thomas for the code', s: 'done' },
        { t: 'Notes for josie-stats (pad bug it shares; Meet stars and the bunching lesson) copied to its docs/handoff/', s: 'done' },
        { t: 'From josie-stats: stars survive a reload; plain-word screen-reader announcements; high-contrast stars', s: 'done' },
        { t: 'Review 2 (adversarial code review + browser QA, then confirmation passes): Write cards never show the answer or sit on written/read places; hints give the sound last; pad fits the ink; QA verdict SHIP', s: 'done' },
        { t: 'After a finished day: “Review 10” (review only), “Write 10” (Write the Hebrew cards only, for words already met) and “Meet 5 new” (its own Meet round and stars; back to the usual number tomorrow)', s: 'done' },
        { t: 'Variety: in-verse, Another form, Which word? and Write cards move to another of the word’s verses each review (158 words have more than one)', s: 'done' },
      ] },
    { id: 'm3', title: 'More books', status: 'later',
      summary: 'Jonah, Genesis chapters, Psalms. The pipeline takes a book name; the app needs a book picker and per-book pace (Steve: 5 a day may suit a new book).',
      tasks: [] },
  ],
  actions: [
    { id: 'a1', title: 'Try it, then tell me the pace', urgency: 'soon', unblocks: 'the right default for new words a day',
      advice: 'QA measured about 60 card views on day 1 and about 150 by day 7 at 10 new words a day. If that is heavy, Settings → New words per day → 5. Steve, 2026-10-24: 10 feels right (with Meet 5 new for extra days).', done: true },
    { id: 'a2', title: 'One small text question: 3:14 qere holam', urgency: 'later', unblocks: 'how the read form of 3:14 is displayed',
      advice: 'OSHB gives the read form as מַרְגְּלוֹתָיוֹ with a holam on the final vav; review B thinks it is a stray mark from the ketiv pointing. Keep as source (current) or show the conventional form?', done: false },
  ],
  tryThis: [
    { id: 't9', date: '2026-10-24', title: 'The same word, a different verse',
      steps: 'Keep studying as usual. When a card for a common word comes back (say אָמַר “to say”, or כִּי), its verse should differ from last time. Words that occur only once in Ruth still show their one verse.' },
    { id: 't8', date: '2026-10-24', title: 'Review 10, Write 10, Meet 5 new',
      steps: 'Finish the day’s session. Under it: “Review 10” (words already met, ahead of schedule), “Write 10” (only Write the Hebrew cards, for words you have met) and “Meet 5 new”, which starts a fresh Meet round of five words with its own five stars. Tomorrow is back to your usual number.' },
    { id: 't7', date: '2026-10-23', title: 'Read, then listen on Haktuvim',
      steps: 'Read → any chapter → “Listen to chapter N on Haktuvim” (under the chapter numbers). It opens that chapter on haktuvim.co.il with its audio player at the top.' },
    { id: 't6', date: '2026-10-23', title: 'Stars in Meet; Write the Hebrew',
      steps: 'Today: the Meet chip at the top now has five hollow stars; a gold one floats up at each fifth of the way through Meet, evenly spaced (about every 12 cards at 10 new words). Write the Hebrew cards start once you have read a word in its verse twice, a few cards after the second time, on day one. Settings → Write the Hebrew sets how many views unlock the card (1, 2, 3, 5 or Off) and whether you write the dictionary form or the form in the verse.' },
    { id: 't5', date: '2026-10-23', title: 'Full-screen pad round trip; הִיא in Words',
      steps: 'Today → write bigger → write a word → Done → write bigger again: the ink is back at full size, however many times you go back and forth. In Words, הוּא “he” and הִיא “she” are now separate entries, each with a “Don’t confuse” note.' },
    { id: 't4', date: '2026-10-22', title: 'Tap a word: English first now',
      steps: 'Read → any verse → tap a word. The pop-up leads with plain English for that form (“and she went / walked”, “and you (f) will go down”), then one short line of parts, with the full parse under “Full parse”. Look up אֶל in Words: it now has a “Don’t confuse” box. Tell me if the English ever reads as taking a side, or if the breakdown is still too much.' },
    { id: 't1', date: '2026-10-22', title: 'Try a Today session (once the site is live)',
      steps: 'Open the live site on your phone. The first visit shows How it works; then Today offers 10 new words as 20 cards. Try a hint, the writing pad, and the three grading buttons.' },
    { id: 't2', date: '2026-10-22', title: 'Read Ruth 3:3–4 and tap the bracketed forms',
      steps: 'Read tab → chapter 3. Each written/read place shows the read form with ק and the written consonants in brackets marked כ. Tap one: both readings appear with their own parse. Then switch Settings → Unpointed and look again: the written consonants lead.' },
    { id: 't3', date: '2026-10-22', title: 'Written and read page',
      steps: 'Read → "Written and read: 13 places". Each place hides both parses until you open it. Tell me if any wording takes a side.' },
  ],
  docs: [
    { title: 'Review 2: code', href: 'docs/review/code-2.md', blurb: 'Adversarial review of the 2026-10-23 changes: 11 findings, then a confirmation pass (all fixed or accepted; 3 minor follow-ups fixed).', date: '2026-10-23' },
    { title: 'Review 2: QA', href: 'docs/review/qa-2.md', blurb: 'Written test plan run in a real browser at phone and desktop width: FIX FIRST, then SHIP on the confirmation pass.', date: '2026-10-23' },
    { title: 'README', href: 'README.md', blurb: 'What the app does, repository layout, how to build and test, how corrections and new books work, sources and licences.', date: '2026-10-23' },
    { title: 'Notes for josie-stats', href: 'docs/handoff/to-josie-stats-2026-10-23.md', blurb: 'The pad shrink bug both projects had and its fix; Meet stars and why counting finished cards bunched them. Copied to josie-stats/docs/handoff/.', date: '2026-10-23' },
    { title: 'STATUS.md', href: 'STATUS.md', blurb: 'Narrative status: what got done, decisions taken (veto-able), banked ideas.', date: '2026-10-23' },
    { title: 'Review packet: every word’s English', href: 'docs/review/ruth-renderings.md', blurb: 'All 1,306 words of Ruth with form, parse, gloss and the generated English, verse by verse.', date: '2026-10-22' },
    { title: 'Renderings review', href: 'docs/review/renderings-1.md', blurb: 'Every word’s English checked against its parse and BDB; findings, override checks, look-alike proposals, and the confirmation pass.', date: '2026-10-22' },
    { title: 'QA report', href: 'docs/review/qa-1.md', blurb: 'Written-plan QA: 13 scenarios including a 7-day simulation with a faked clock. Verdict SHIP.', date: '2026-10-22' },
    { title: 'Content review B (independent sources)', href: 'docs/review/content-B.md', blurb: 'Every gloss checked against BDB on Sefaria; found the H9 affix bug and about 40 glosses that missed Ruth’s sense. Most fixes trace to this report.', date: '2026-10-22' },
    { title: 'Content review A (cited sources)', href: 'docs/review/content-A.md', blurb: 'Re-derived every join, count and parse independently of the pipeline.', date: '2026-10-22' },
    { title: 'Code review', href: 'docs/review/code-1.md', blurb: 'Fresh-agent review of the code; found the 4:6 maqqef and stale-session bugs.', date: '2026-10-22' },
    { title: 'Design as built', href: 'docs/agents/DESIGN.md', blurb: 'What the first slice does and where each piece of data comes from.', date: '2026-10-22' },
    { title: 'Review packet: every Ruth word', href: 'docs/review/ruth-lexemes.md', blurb: 'All 285 words, 30 names and 13 written/read places with gloss, BDB citation and first occurrence. Generated from the built data.', date: '2026-10-22' },
    { title: 'Notes on lomed', href: 'reference/lomed/README.md', blurb: 'What was taken from the earlier lomed project (resources only) and the bugs found in its parser.', date: '2026-10-22' },
    { title: 'Learning strategy handoff', href: 'LEARNING-STRATEGY-START-HERE.md', blurb: 'The starting brief from the josie-stats session. Historical: some of its assumptions were revised (see STATUS).', date: '2026-10-22' },
  ],
};
/* ==== DATA END ==== */

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'hbb-board-v1';
let notes = {}; try { notes = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { notes = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch (e) { /* ignore */ } };
const TABS = [
  ['roadmap', 'Roadmap', () => BOARD.roadmap.length],
  ['actions', 'Your queue', () => BOARD.actions.filter(a => !a.done && a.title !== 'Nothing needed from you right now').length],
  ['try', 'Try this', () => BOARD.tryThis.length],
  ['docs', 'Docs', () => BOARD.docs.length],
];
let tab = 'roadmap'; try { tab = localStorage.getItem(KEY + ':tab') || 'roadmap'; } catch (e) { /* ignore */ }
function render() {
  document.getElementById('asof').textContent = `As of ${BOARD.meta.asOf}. ${BOARD.meta.headline}`;
  document.getElementById('tabs').innerHTML = TABS.map(([k, n, c]) => `<button role="tab" aria-selected="${tab === k}" data-tab="${k}">${n}<span class="n">${c()}</span></button>`).join('');
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { tab = b.dataset.tab; try { localStorage.setItem(KEY + ':tab', tab); } catch (e) { /* ignore */ } render(); });
  const m = document.getElementById('main');
  if (tab === 'roadmap') {
    m.innerHTML = `<div class="stats">${BOARD.meta.stats.map(s => `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`).join('')}</div>`
      + `<p class="muted">${BOARD.meta.links.map(l => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join(' · ')}</p>`
      + BOARD.roadmap.map(r => `<div class="card"><h2>${esc(r.title)} <span class="chip ${r.status}">${esc(r.status)}</span></h2><p class="p">${esc(r.summary)}</p>
        ${r.tasks.length ? `<ul class="tasks">${r.tasks.map(t => `<li class="st-${t.s}"><span>${esc(t.t)}</span></li>`).join('')}</ul>` : ''}</div>`).join('');
  } else if (tab === 'actions') {
    m.innerHTML = BOARD.actions.map(a => `<div class="card${a.done ? ' struck' : ''}"><h2>${esc(a.title)} <span class="chip ${a.urgency}">${esc(a.urgency)}</span></h2>
      <p class="p"><b>Unblocks:</b> ${esc(a.unblocks)}</p><p class="p">${esc(a.advice)}</p></div>`).join('');
  } else if (tab === 'try') {
    m.innerHTML = BOARD.tryThis.map(t => { const n = notes[t.id] || {}; return `<div class="card try"><h2>${esc(t.title)} <span class="muted">${esc(t.date)}</span></h2><p class="p">${esc(t.steps)}</p>
      <label><input type="checkbox" data-done="${t.id}" ${n.done ? 'checked' : ''}> Tried it</label>
      <textarea data-note="${t.id}" placeholder="Notes for Claude">${esc(n.note || '')}</textarea></div>`; }).join('')
      + `<button class="btn" id="copy">Copy my feedback</button> <span class="muted" id="copied"></span>`;
    m.querySelectorAll('[data-done]').forEach(c => c.onchange = () => { (notes[c.dataset.done] = notes[c.dataset.done] || {}).done = c.checked; save(); });
    m.querySelectorAll('[data-note]').forEach(x => x.oninput = () => { (notes[x.dataset.note] = notes[x.dataset.note] || {}).note = x.value; save(); });
    document.getElementById('copy').onclick = async () => {
      const text = BOARD.tryThis.map(t => { const n = notes[t.id] || {}; return `- ${t.title}: ${n.done ? 'tried' : 'not tried'}${n.note ? `. ${n.note}` : ''}`; }).join('\n');
      try { await navigator.clipboard.writeText(`Hebrew by Book feedback (${new Date().toISOString().slice(0, 10)}):\n${text}`); document.getElementById('copied').textContent = 'Copied.'; }
      catch (e) { document.getElementById('copied').textContent = 'Copy failed; select the notes by hand.'; }
    };
  } else {
    m.innerHTML = BOARD.docs.map(d => `<div class="card"><h2><a href="${esc(d.href)}">${esc(d.title)}</a> <span class="muted">${esc(d.date)}</span></h2><p class="p">${esc(d.blurb)}</p></div>`).join('');
  }
}
render();
</script>
</body>
</html>
